[package]
name = "mailx-mcp-bridge"
description = "Stdio-to-local-IPC bridge that lets MCP clients reach a running MailX"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "mailx-mcp"
path = "src/main.rs"

# Deliberately small: no mailx-core, no storage. See docs/contracts/mcp.md.
[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt", "time"] }

[dev-dependencies]
mailx-core.workspace = true
mailx-mcp-server = { path = "../mcp-server" }
tempfile = "3"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
