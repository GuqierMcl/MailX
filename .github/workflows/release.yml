name: Release

# Pushing a `vX.Y.Z[-alpha|beta|rc.N]` tag builds the installers and leaves a DRAFT
# GitHub Release; a person publishes it after trying the installers. Publishing it
# as a normal Release is what ships it to the in-app updater: the app reads the
# Latest release's `latest.json`, and the version suffix only changes the notes.
# Tick "Pre-release" to publish without pushing the update.
# "Run workflow" (workflow_dispatch) builds the same installers from any branch and
# keeps them as run artifacts only. It never creates a release, so the workflow can
# be debugged without burning a version.
# Steps for maintainers: docs/development/release.md
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One release run per ref. A running release is never cancelled halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Every recorded version agrees (and the tag names it)
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            bun scripts/check-version.mjs --release --tag "$GITHUB_REF_NAME"
          else
            bun scripts/check-version.mjs
          fi
      - name: The tagged commit is on main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME does not point into main. Merge the release PR first, then tag the merge commit."
            exit 1
          fi
      - id: meta
        run: |
          version=$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("package.json","utf8")).version)')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        run: bun scripts/release-notes.mjs "${{ steps.meta.outputs.version }}" > release-notes.md
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7
      # The updater manifest takes its notes from this same file (§4).
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: changelog
          path: CHANGELOG.md
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: macos-arm64, os: macos-15 }
          # Intel runner label: confirm it still exists when the matrix changes.
          - { name: macos-x64, os: macos-15-intel }
          - { name: windows-x64, os: windows-2025 }
          - { name: linux-x64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    # The updater signing key lives in this environment's secrets; a fork or a
    # pull request never reaches it.
    environment: release
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      # The runner's Azure Ubuntu mirror can make slow progress until the
      # installation deadline. Prefer the official HTTPS mirrors, while keeping
      # retries, connection/read timeouts and the overall step limit.
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          # Support both direct Ubuntu sources and the runner's mirror+file layout.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i -E 's#https?://azure[.]archive[.]ubuntu[.]com/ubuntu(/|[[:space:]]|$)#https://archive.ubuntu.com/ubuntu\1#g' "$source"
            fi
          done
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update --error-on=any
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libasound2-dev pkg-config \
            patchelf
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # bundle.targets in desktop/tauri.conf.json lists every format; each runner
      # builds the ones it supports (dmg, nsis, deb + rpm + appimage).
      - run: bun run tauri build
      - name: Collect and rename installers
        shell: bash
        run: |
          mkdir dist-release
          find target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp -v {} dist-release/ \;
          # Name every asset after the operating system it installs on, so a
          # download is chosen by OS and architecture is only the suffix:
          #   MailX_<version>_macos-arm64.dmg, MailX_<version>_windows-x64-setup.exe
          bun scripts/release-assets.mjs \
            --dir dist-release \
            --version "${{ needs.verify.outputs.version }}" \
            --platform "${{ matrix.name }}"
          ls -l dist-release
          test -n "$(ls dist-release)"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7

  # Only on a tag, and only after every platform built: a failed platform leaves no
  # half-filled draft behind.
  release:
    name: Draft release
    needs: [verify, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: actions/download-artifact@v4
        with:
          name: changelog
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Updater manifest (latest.json)
        run: |
          bun scripts/updater-manifest.mjs \
            --version "$VERSION" \
            --dir dist \
            --base-url "https://github.com/$GH_REPO/releases/download/$TAG" \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --notes CHANGELOG.md \
            --out dist/latest.json
          cat dist/latest.json
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the draft release
        run: |
          set -euo pipefail
          # Never `--prerelease` on its own: whether this Release reaches existing
          # installations is the maintainer's choice at publish time. The
          # "预发布版本" notice in the notes still follows the version suffix.
          # A re-run replaces its own earlier draft (the tag stays), but a published
          # release is never overwritten.
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::Release $TAG is already published; refusing to overwrite it."
              exit 1
            fi
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" dist/* \
            --draft --verify-tag \
            --title "MailX $VERSION" \
            --notes-file release-notes.md
