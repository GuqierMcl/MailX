name: Release

# Pushing a `vX.Y.Z[-alpha|beta|rc.N]` tag builds the installers and leaves a DRAFT
# GitHub Release; a person publishes it after trying the installers. Publishing it
# as a normal Release is what ships it to the in-app updater: the app reads the
# Latest release's `latest.json`, and the version suffix only changes the notes.
# Tick "Pre-release" to publish without pushing the update.
# "Run workflow" (workflow_dispatch) builds the same installers from any branch and
# keeps them as run artifacts only. It never creates a release, so the workflow can
# be debugged without burning a version.
# Steps for maintainers: docs/development/release.md
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One release run per ref. A running release is never cancelled halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Every recorded version agrees (and the tag names it)
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            bun scripts/check-version.mjs --release --tag "$GITHUB_REF_NAME"
          else
            bun scripts/check-version.mjs
          fi
      - name: The tagged commit is on main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME does not point into main. Merge the release PR first, then tag the merge commit."
            exit 1
          fi
      # A release commit on main gets light checks when the commit before it
      # passed the full suite, and the full suite otherwise. Installers are built
      # only from a commit whose CI on main passed, so a tag pushed too early
      # fails here, before any build. Re-run this workflow once the CI result is
      # green.
      - name: The tagged commit passed CI on main
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusions=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=CI%20result&filter=all" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions") | (.conclusion // .status)] | join(" ")')
          echo "CI result on $GITHUB_SHA: ${conclusions:-none}"
          case " $conclusions " in
            *" success "*) ;;
            *)
              echo "::error::CI on main has not passed for this commit yet (${conclusions:-no run}). Wait for the CI result to turn green, then re-run this workflow."
              exit 1
              ;;
          esac
      - id: meta
        run: |
          version=$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("package.json","utf8")).version)')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        run: bun scripts/release-notes.mjs "${{ steps.meta.outputs.version }}" > release-notes.md
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7
      # The updater manifest takes its notes from this same file (§4).
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: changelog
          path: CHANGELOG.md
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          # macOS 26 and later give apps the current window frame and traffic
          # lights only when they are built with SDK 26 or later; the default
          # Xcode on these images provides it, and a later step checks it.
          - { name: macos-arm64, os: macos-26 }
          # Intel runner label: confirm it still exists when the matrix changes.
          - { name: macos-x64, os: macos-26-intel }
          - { name: windows-x64, os: windows-2025 }
          # Both Linux runners build natively on the supported Ubuntu baseline.
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    # The updater signing key lives in this environment's secrets; a fork or a
    # pull request never reaches it.
    environment: release
    # Notarization waits on Apple's queue, which is outside this workflow's
    # control: the first signed run spent 45 minutes there after a build of
    # about 15. An unsigned build needed well under 60, so the ceiling leaves
    # room for a slow queue rather than cutting a build that is still waiting.
    timeout-minutes: 90
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: bash scripts/install-linux-build-deps.sh --packaging
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # The default cache key does not distinguish Ubuntu releases.
          key: ${{ matrix.os }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # bundle.targets in desktop/tauri.conf.json lists every format; each runner
      # builds the ones it supports (dmg, nsis, deb + rpm + appimage).
      - name: Build Linux installers
        if: runner.os == 'Linux'
        run: |
          bun scripts/prepare-linux-appimage.mjs --out "$RUNNER_TEMP/tauri-linux-appimage.json"
          bun run tauri build --config "$RUNNER_TEMP/tauri-linux-appimage.json"
      # Developer ID signing and notarization credentials. They live in the
      # release environment and are handed to the macOS build alone; the
      # certificate, its password and the App Store Connect key never reach
      # Windows or Linux runners. The key file keeps macOS's default mode on
      # purpose: notarytool rejects a group- or world-readable key.
      - name: Prepare the notarization API key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          test -s "$RUNNER_TEMP/AuthKey.p8"
      - name: Build macOS installers
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: bun run tauri build
      - run: bun run tauri build
        if: runner.os == 'Windows'
      # A binary built with an older SDK runs in compatibility mode on macOS 26
      # and later: the traffic lights change size and no longer sit where the
      # title bar layout expects them.
      - name: Check the macOS SDK
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$app"
          bash scripts/check-macos-sdk.sh "$app"
      # Tauri notarizes and staples the .app, then packs it into a .dmg that it
      # only signs. People download the .dmg, so it gets a ticket of its own:
      # without one, the first open has to ask Apple over the network.
      - name: Notarize the disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          dmg=$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n 1)
          test -n "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 40m --output-format json | tee "$RUNNER_TEMP/notarize-dmg.json"
          status=$(bun -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).status)' "$RUNNER_TEMP/notarize-dmg.json")
          if [ "$status" != "Accepted" ]; then
            echo "::error::Apple did not accept the disk image (status: $status). Run 'xcrun notarytool log <id>' for the reasons."
            exit 1
          fi
          xcrun stapler staple "$dmg"
      # A signature that only looks right is worse than none: without the
      # Developer ID authority, the hardened runtime and a secure timestamp,
      # Gatekeeper either refuses the app or stops accepting it once the
      # certificate expires. Without a stapled ticket the first launch needs
      # the network. Without a ticket on the .dmg, the artifact people actually
      # download is what gets flagged. Each check names itself when it fails.
      - name: Verify the macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)
          dmg=$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n 1)
          test -n "$app"
          test -n "$dmg"
          fail() { echo "::error::$1"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app" || fail "The app signature does not verify."
          report=$(codesign --display --verbose=4 "$app" 2>&1)
          printf '%s\n' "$report"
          grep -q '^Authority=Developer ID Application:' <<<"$report" || fail "The app is not signed with a Developer ID Application certificate."
          # codesign prints the flags inside the CodeDirectory line, for example
          # "CodeDirectory v=20500 size=… flags=0x10000(runtime) hashes=…".
          grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]+\([^)]*runtime' <<<"$report" || fail "The app does not use the hardened runtime."
          grep -q '^Timestamp=' <<<"$report" || fail "The app signature has no secure timestamp."
          spctl --assess --type exec --verbose=4 "$app" || fail "Gatekeeper rejects the app."
          # The bundled MCP sidecar is a nested executable and must carry the
          # same signature as the app around it.
          sidecar=$(find "$app/Contents/MacOS" -maxdepth 1 -name 'mailx-mcp*' -type f | head -n 1)
          test -n "$sidecar" || fail "The MCP sidecar is missing from the app."
          codesign --verify --strict --verbose=2 "$sidecar" || fail "The MCP sidecar signature does not verify."
          codesign --verify --strict --verbose=2 "$dmg" || fail "The disk image signature does not verify."
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg" || fail "Gatekeeper rejects the disk image."
          xcrun stapler validate "$app" || fail "The app has no stapled notarization ticket."
          xcrun stapler validate "$dmg" || fail "The disk image has no stapled notarization ticket."
      - name: Collect and rename installers
        shell: bash
        run: |
          mkdir dist-release
          find target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp -v {} dist-release/ \;
          # Name every asset after the operating system it installs on, so a
          # download is chosen by OS and architecture is only the suffix:
          #   MailX_<version>_macos-arm64.dmg, MailX_<version>_windows-x64-setup.exe
          bun scripts/release-assets.mjs \
            --dir dist-release \
            --version "${{ needs.verify.outputs.version }}" \
            --platform "${{ matrix.name }}"
          ls -l dist-release
          test -n "$(ls dist-release)"
      - name: Verify Linux installer architectures
        if: runner.os == 'Linux'
        env:
          PLATFORM: ${{ matrix.name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          asset="dist-release/MailX_${VERSION}_${PLATFORM}"
          bash scripts/check-linux-installers.sh "$PLATFORM" "$asset.deb" "$asset.rpm" "$asset.AppImage"
          test -s "$asset.AppImage.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7

  # Only on a tag, and only after every platform built: a failed platform leaves no
  # half-filled draft behind.
  release:
    name: Draft release
    needs: [verify, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: actions/download-artifact@v4
        with:
          name: changelog
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Updater manifest (latest.json)
        run: |
          bun scripts/updater-manifest.mjs \
            --version "$VERSION" \
            --dir dist \
            --base-url "https://github.com/$GH_REPO/releases/download/$TAG" \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --notes CHANGELOG.md \
            --out dist/latest.json
          cat dist/latest.json
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the draft release
        run: |
          set -euo pipefail
          # Never `--prerelease` on its own: whether this Release reaches existing
          # installations is the maintainer's choice at publish time. The
          # "预发布版本" notice in the notes still follows the version suffix.
          # A re-run replaces its own earlier draft (the tag stays), but a published
          # release is never overwritten.
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::Release $TAG is already published; refusing to overwrite it."
              exit 1
            fi
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" dist/* \
            --draft --verify-tag \
            --title "MailX $VERSION" \
            --notes-file release-notes.md
