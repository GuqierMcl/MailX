name: Linux AppImage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-appimage-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  startup:
    name: Linux installers (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-24.04 }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        timeout-minutes: 20
        run: bash scripts/install-linux-build-deps.sh --packaging
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Prepare Linux tray dependencies
        run: bun scripts/prepare-linux-appimage.mjs --out "$RUNNER_TEMP/tauri-linux-appimage.json"
      # Manual checks never use the release environment or signing credentials.
      - name: Build unsigned Linux installers
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          bun run tauri build \
            --config "$RUNNER_TEMP/tauri-linux-appimage.json" \
            --bundles deb,rpm,appimage \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Check installer architectures
        id: installers
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          shopt -s nullglob
          appimages=(target/release/bundle/appimage/*.AppImage)
          debs=(target/release/bundle/deb/*.deb)
          rpms=(target/release/bundle/rpm/*.rpm)
          if [ "${#appimages[@]}" -ne 1 ] || [ "${#debs[@]}" -ne 1 ] || [ "${#rpms[@]}" -ne 1 ]; then
            echo 'Expected exactly one DEB, RPM and AppImage.' >&2
            exit 1
          fi
          bash scripts/check-linux-installers.sh "$PLATFORM" "${debs[0]}" "${rpms[0]}" "${appimages[0]}"
          printf 'deb=%s\nappimage=%s\n' "${debs[0]}" "${appimages[0]}" >> "$GITHUB_OUTPUT"
      - name: Check AppImage startup and missing-tray fallback
        env:
          APPIMAGE: ${{ steps.installers.outputs.appimage }}
        run: bash scripts/smoke-linux-appimage.sh "$APPIMAGE"
      - name: Install the DEB on clean Ubuntu 24.04
        env:
          DEB: ${{ steps.installers.outputs.deb }}
        run: |
          docker run --rm --env DEBIAN_FRONTEND=noninteractive \
            --mount "type=bind,src=$(realpath "$DEB"),dst=/tmp/MailX.deb,readonly" \
            ubuntu:24.04 bash -ec '
              apt-get -o Acquire::Retries=3 update --error-on=any
              apt-get -o Acquire::Retries=3 install -y --no-install-recommends /tmp/MailX.deb
              test -x /usr/bin/mailx-desktop
              test -x /usr/bin/mailx-mcp
            '
      - name: Preserve installers for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 1
      - name: Preserve Linux AppImage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-evidence-${{ matrix.platform }}
          path: target/linux-appimage-evidence
          if-no-files-found: warn
