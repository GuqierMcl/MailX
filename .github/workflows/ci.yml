name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR supersedes the running checks; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides what a change needs. The checks below are required by the branch
  # ruleset, so the workflow itself must always run: a workflow skipped by
  # `paths-ignore` leaves its required checks pending forever. A job skipped
  # through `if` reports success instead, which lets docs-only PRs merge.
  #   - docs:    documentation and text only, nothing to build;
  #   - site:    only website files, possibly with documentation: the website
  #              checks run, the application's do not;
  #   - release: only a version bump written by `version:bump` / `version:set`
  #              plus CHANGELOG.md, checked by the light release job below;
  #   - code:    everything else, the full suite.
  # `website` is separate: the website is checked whenever something it is built
  # from changed. A push to main is `release` or `site` only on top of a commit
  # whose CI result already passed: the application is then identical to a fully
  # checked commit. Every other push to main is `code`. The Release workflow refuses
  # tags whose CI result has not passed.
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
    outputs:
      kind: ${{ steps.filter.outputs.kind }}
      website: ${{ steps.filter.outputs.website }}
      code: ${{ steps.filter.outputs.kind == 'code' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every classifier comes from the base commit, so a change cannot alter
          # how it is judged. A missing classifier or any error runs everything.
          kind=code
          website=true
          finish() {
            echo "kind=$kind  website=$website"
            { echo "kind=$kind"; echo "website=$website"; } >> "$GITHUB_OUTPUT"
            exit 0
          }
          base_scripts="$RUNNER_TEMP/base/scripts"
          is_release() {
            local verdict
            verdict=$(bun "$base_scripts/check-release-pr.mjs" "$1" "$2") || return 1
            echo "$verdict"
            [ "$(printf '%s\n' "$verdict" | tail -n 1)" = "release" ]
          }
          scope=""
          read_scope() {
            scope=$(bun "$base_scripts/check-change-scope.mjs" "$1") || { scope=""; return 1; }
            echo "$scope"
            if grep -qx 'website=false' <<< "$scope"; then website=false; fi
          }
          if [ "$EVENT" = "pull_request" ]; then
            git worktree add --detach "$RUNNER_TEMP/base" "$BASE" || finish
            read_scope "$BASE...$HEAD" || true
            if grep -qx 'scope=docs' <<< "$scope"; then
              kind=docs
            elif grep -qx 'scope=site' <<< "$scope"; then
              kind=site
            elif is_release "$BASE" "$HEAD"; then
              kind=release
            fi
            finish
          fi
          # A push to main may skip only when the previous tip of main already has
          # a passing CI result and everything pushed since is a version bump of it
          # or touches the website alone: the application is then identical to a
          # checked commit. Documentation pushes are not skipped on main.
          # A new branch reports an all-zero `before`.
          if [ "$EVENT" = "push" ] && [ -n "${BEFORE//0/}" ] &&
            git merge-base --is-ancestor "$BEFORE" "$GITHUB_SHA" &&
            git worktree add --detach "$RUNNER_TEMP/base" "$BEFORE"; then
            read_scope "$BEFORE..$GITHUB_SHA" || true
            # The latest attempts only, so a failed re-run counts as failed;
            # all of them must have succeeded, and there must be at least one.
            ci=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BEFORE/check-runs?check_name=CI%20result&filter=latest" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions") | (.conclusion // .status)]
                | if length > 0 and all(. == "success") then "success" else (join(" ") | if . == "" then "none" else . end) end') || ci=""
            echo "CI result on the previous main $BEFORE: ${ci:-none}"
            if [ "$ci" = "success" ]; then
              if grep -qx 'site-only=true' <<< "$scope"; then
                kind=site
              elif is_release "$BEFORE" "$GITHUB_SHA"; then
                kind=release
              fi
            fi
          fi
          finish

  # A release PR changes nothing but versions and the changelog, which is what
  # these checks cover. Merged onto a main whose CI passed, it gets the same
  # light checks there; otherwise main runs the full suite.
  release:
    name: Release PR checks
    needs: changes
    if: needs.changes.outputs.kind == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run version:check --release
      - run: bun run version:test

  # Builds the site as .github/workflows/website.yml does, without deploying it.
  website:
    name: Website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # website/package.json carries the shared version.
      - run: bun run version:check
      - run: bun run site:check
      - run: bun run site:build
        env:
          # Reads the latest release for the download page.
          GITHUB_TOKEN: ${{ github.token }}

  frontend:
    name: Frontend and repository checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run version:check
      - run: bun run version:test
      - run: bun run i18n:check
      # icons:check is left out: it compares zlib output byte for byte, which
      # differs between zlib builds even when the pixels are identical.
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run frontend:test
      - run: bun run build

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # The macOS runner matches the release build's, so tests use the same SDK.
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: bash scripts/install-linux-build-deps.sh
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep native artifacts from different Ubuntu releases separate.
          key: ${{ matrix.os }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Tauri checks frontendDist at compile time.
      - run: bun run build
      - name: Formatting
        if: runner.os == 'Linux'
        run: bun run rust:fmt
      - name: Generated TypeScript types are current
        if: runner.os == 'Linux'
        run: bun run types:check
      - run: bun run rust:clippy
      - run: bun run rust:test

  # The one check the branch ruleset should require. A matrix job that is skipped
  # reports a single unexpanded name ("Rust (${{ matrix.os }})"), never the three
  # names the ruleset waits for, so requiring the matrix jobs directly leaves every
  # docs-only pull request pending forever. This job always runs and decides:
  #   - code changed: the frontend job and every Rust matrix job must have passed;
  #   - a release PR: the release checks must have passed, the rest skipped;
  #   - website only: the website checks must have passed, the rest skipped;
  #   - documentation only: everything must have been skipped (or passed);
  #   - whatever the kind, a website that had to be built must have passed;
  #   - anything failed or was cancelled, or change detection broke: fail.
  result:
    name: CI result
    needs: [changes, release, website, frontend, rust]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Judge the checks
        env:
          CHANGES: ${{ needs.changes.result }}
          KIND: ${{ needs.changes.outputs.kind }}
          SITE_NEEDED: ${{ needs.changes.outputs.website }}
          WEBSITE: ${{ needs.website.result }}
          RELEASE: ${{ needs.release.result }}
          FRONTEND: ${{ needs.frontend.result }}
          RUST: ${{ needs.rust.result }}
        run: |
          echo "change detection: $CHANGES (kind=$KIND, website=$SITE_NEEDED)  website: $WEBSITE  release: $RELEASE  frontend: $FRONTEND  rust: $RUST"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Change detection did not succeed, so nothing can be trusted."
            exit 1
          fi
          settled() {
            for result in "$@"; do
              case "$result" in
                success | skipped) ;;
                *) echo "::error::A check ended as '$result'."; exit 1 ;;
              esac
            done
          }
          case "$SITE_NEEDED" in
            true)
              if [ "$WEBSITE" != "success" ]; then
                echo "::error::The website changed, so its checks must pass."
                exit 1
              fi
              ;;
            false) settled "$WEBSITE" ;;
            *)
              echo "::error::Unexpected change detection output website='$SITE_NEEDED'."
              exit 1
              ;;
          esac
          case "$KIND" in
            code)
              if [ "$FRONTEND" != "success" ] || [ "$RUST" != "success" ]; then
                echo "::error::Code changed, so the frontend and Rust checks must pass."
                exit 1
              fi
              settled "$RELEASE"
              ;;
            release)
              if [ "$RELEASE" != "success" ]; then
                echo "::error::A release PR must pass the release checks."
                exit 1
              fi
              settled "$FRONTEND" "$RUST"
              ;;
            docs | site)
              settled "$RELEASE" "$FRONTEND" "$RUST"
              ;;
            *)
              echo "::error::Unexpected change detection output '$KIND'."
              exit 1
              ;;
          esac
          echo "All required checks are satisfied."
