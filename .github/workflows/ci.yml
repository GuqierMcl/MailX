name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR supersedes the running checks; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether anything beyond documentation changed. The checks below are
  # required by the branch ruleset, so the workflow itself must always run: a
  # workflow skipped by `paths-ignore` leaves its required checks pending forever.
  # A job skipped through `if` reports success instead, which lets docs-only PRs merge.
  changes:
    name: Detect code changes
    runs-on: ubuntu-22.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Pushes to main always run everything. Only pull requests may skip.
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Documentation and text only: anything else, including code that
          # lives next to docs, workflows, scripts and lockfiles, counts as code.
          # A failed diff must fall through to "code", never to "docs only".
          if ! files=$(git diff --name-only "$BASE...$HEAD"); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          echo "$files"
          # Count the changed files that are NOT documentation. Counting lines
          # (rather than relying on grep's exit status) keeps this unambiguous.
          # shellcheck disable=SC2126 # `grep -c` exits non-zero on zero matches.
          other=$(printf '%s\n' "$files" | grep -Ev '^(docs/.*\.(md|webp|png|jpg|svg)|[^/]+\.md|LICENSE|\.github/ISSUE_TEMPLATE/.*\.md|\.github/pull_request_template\.md)$' | wc -l | tr -d ' ') || other=1
          if [ -z "$files" ] || [ "${other:-1}" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend and repository checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run version:check
      - run: bun run version:test
      - run: bun run i18n:check
      # icons:check is left out: it compares zlib output byte for byte, which
      # differs between zlib builds even when the pixels are identical.
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run frontend:test
      - run: bun run build

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The runner's Azure Ubuntu mirror can make slow progress until the
      # installation deadline, so the official HTTPS mirrors are tried first.
      # Every *.ubuntu.com host can also be unreachable from the runner (DNS
      # failures for over an hour on 2026-11-11), so a failed attempt retries
      # with the runner's own mirror and then with community mirrors outside
      # ubuntu.com. APT still verifies every index against Ubuntu's signing
      # keys, so a mirror cannot change what is installed. Each attempt keeps
      # retries, connection/read timeouts and its own time limit.
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          sources=(/etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt)
          for source in "${sources[@]}"; do
            if [ -f "$source" ]; then sudo cp -a "$source" "$source.runner"; fi
          done
          use_runner_mirrors() {
            for source in "${sources[@]}"; do
              if [ -f "$source.runner" ]; then sudo cp -a "$source.runner" "$source"; fi
            done
          }
          # Rewrites the runner's Ubuntu hosts matching $1 to the base URL $2 in
          # direct sources, and lists $2 and $3 in the mirror+file layout.
          use_mirrors() {
            use_runner_mirrors
            for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [ -f "$source" ]; then
                sudo sed -i -E 's#https?://('"$1"')[.]ubuntu[.]com/ubuntu(/|[[:space:]]|$)#'"$2"'\2#g' "$source"
              fi
            done
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf '%s/\tpriority:1\n%s/\tpriority:2\n' "$2" "$3" | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
            fi
          }
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          install() {
            sudo timeout 180 apt-get "${apt_options[@]}" update --error-on=any &&
              sudo timeout 300 apt-get "${apt_options[@]}" install -y --no-install-recommends \
                libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
                libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libasound2-dev pkg-config
          }
          use_mirrors 'azure[.]archive' https://archive.ubuntu.com/ubuntu https://security.ubuntu.com/ubuntu
          if install; then exit 0; fi
          echo "::warning::Official Ubuntu mirrors failed; retrying with the runner's mirror."
          use_runner_mirrors
          if install; then exit 0; fi
          echo "::warning::The runner's Ubuntu mirror failed; retrying with community mirrors."
          use_mirrors 'azure[.]archive|archive|security' https://mirrors.edge.kernel.org/ubuntu https://mirrors.ocf.berkeley.edu/ubuntu
          install
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep native artifacts from different Ubuntu releases separate.
          key: ${{ matrix.os }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Tauri checks frontendDist at compile time.
      - run: bun run build
      - name: Formatting
        if: runner.os == 'Linux'
        run: bun run rust:fmt
      - name: Generated TypeScript types are current
        if: runner.os == 'Linux'
        run: bun run types:check
      - run: bun run rust:clippy
      - run: bun run rust:test

  # The one check the branch ruleset should require. A matrix job that is skipped
  # reports a single unexpanded name ("Rust (${{ matrix.os }})"), never the three
  # names the ruleset waits for, so requiring the matrix jobs directly leaves every
  # docs-only pull request pending forever. This job always runs and decides:
  #   - code changed: the frontend job and every Rust matrix job must have passed;
  #   - documentation only: they must have been skipped (or passed);
  #   - anything failed or was cancelled, or change detection broke: fail.
  result:
    name: CI result
    needs: [changes, frontend, rust]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Judge the checks
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          FRONTEND: ${{ needs.frontend.result }}
          RUST: ${{ needs.rust.result }}
        run: |
          echo "change detection: $CHANGES (code=$CODE)  frontend: $FRONTEND  rust: $RUST"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Change detection did not succeed, so nothing can be trusted."
            exit 1
          fi
          case "$CODE" in
            true)
              if [ "$FRONTEND" != "success" ] || [ "$RUST" != "success" ]; then
                echo "::error::Code changed, so the frontend and Rust checks must pass."
                exit 1
              fi
              ;;
            false)
              for result in "$FRONTEND" "$RUST"; do
                case "$result" in
                  success | skipped) ;;
                  *) echo "::error::A check ended as '$result'."; exit 1 ;;
                esac
              done
              ;;
            *)
              echo "::error::Unexpected change detection output '$CODE'."
              exit 1
              ;;
          esac
          echo "All required checks are satisfied."
