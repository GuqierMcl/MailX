name: Website

# Builds mailxapp.com (website/) and deploys it to Cloudflare Workers.
#   - push to main, or run by hand on main: deploys;
#   - release published: deploys main again, so the download page and changelog
#     show the new version.
# Pull requests are checked by the Website job in ci.yml. The paths match
# SITE_INPUT in scripts/lib/change-scope.mjs.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/guides/**"
      - "docs/assets/screenshots/**"
      - "branding/**"
      - "frontend/public/**"
      - "CHANGELOG.md"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/website.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Deploys run one after another.
concurrency:
  group: website-deploy
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  website:
    name: Deploy website
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # A release event checks out its tag by default; the site is always
          # built from main.
          ref: ${{ github.event_name == 'release' && 'main' || '' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run site:check
      - run: bun run site:build
        env:
          # Reads the latest release for the download page.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Deploy to Cloudflare
        if: github.event_name == 'release' || github.ref == 'refs/heads/main'
        run: bun run --cwd website deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
