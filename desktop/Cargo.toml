[package]
name = "mailx-desktop"
description = "Tauri desktop host for MailX"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
mailx-core.workspace = true
serde.workspace = true
serde_json = "1"
tauri.workspace = true
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }
security-framework = "3"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }
# Already pulled in by Tauri; used to read GtkSettings title bar preferences.
gtk = "0.18.2"

[dev-dependencies]
tempfile = "3"

[features]
# Enable the custom protocol for loading bundled frontend assets in production builds.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
