[package]
name = "mailx-desktop"
description = "Tauri desktop host for MailX"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
mailx-core.workspace = true
serde.workspace = true
serde_json = "1"
tauri.workspace = true
tauri-plugin-opener = "2"
tauri-plugin-wdio-webdriver = { version = "1.5", optional = true }
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }
security-framework = "3"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }
# Already pulled in by Tauri; used to read GtkSettings title bar preferences.
gtk = "0.18.2"

[target."cfg(windows)".dependencies]
tauri-plugin-prevent-default = { version = "6", features = ["platform-windows"] }

[dev-dependencies]
tempfile = "3"
mailx-core = { workspace = true, features = ["body-webview-test"] }
rusqlite = { version = "0.39", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tauri = { workspace = true, features = ["test"] }

[features]
# Enable the custom protocol for loading bundled frontend assets in production builds.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
body-webview-test = ["dep:tauri-plugin-wdio-webdriver", "mailx-core/body-webview-test"]

[lints]
workspace = true
