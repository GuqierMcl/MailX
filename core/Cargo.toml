[package]
name = "mailx-core"
description = "Host-independent mail engine for MailX"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ammonia = "4"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cssparser = "0.37"
fs2 = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
html5ever = "0.39"
# MIME construction and address parsing only. The SMTP session is hand-written
# over net::connect / net::upgrade_tls, so no lettre transport or TLS feature is enabled.
lettre = { version = "0.11.23", default-features = false, features = ["builder"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "ico"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
rusqlite = { version = "0.39", features = ["bundled"] }
# ring avoids the cmake/nasm toolchain aws-lc needs on Windows.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
scraper = { version = "0.27", default-features = false }
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-socks = "0.5"
ts-rs = { version = "11", features = ["serde-compat", "no-serde-warnings"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
resvg = { version = "0.48.1", default-features = false }

[features]
# Synthetic cache construction is excluded from normal desktop/core builds.
body-webview-test = []

[dev-dependencies]
# Test-only certificates for the fake SMTP servers.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
